[package]
name = "folio-core"
description = "Lógica de negócio do Folio, sem dependência do Tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ammonia = "4.2.5"
base64 = "0.23.1"
blake3 = "1.8.7"
cfb = "0.16.0"
comrak = { version = "0.59", default-features = false }
encoding_rs = "0.8.44"
hayro-font = "0.5.0"
hayro-interpret = "0.9.0"
jiff = "0.2.45"
log = "0.4.35"
office-crypto = "0.4.0"
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
rusqlite = { version = "0.42.0", features = ["bundled", "functions"] }
rustix = { version = "1.1.6", features = ["fs"] }
saphyr = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
trash = "5.3.0"
ts-rs = { version = "12", features = ["uuid-impl", "serde-json-impl"] }
typst = "0.15.1"
typst-as-lib = "0.18"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.2", features = ["serde", "v7"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[dev-dependencies]
krilla = "0.8.2"
md-5 = "0.10.6"
