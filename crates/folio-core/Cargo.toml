[package]
name = "folio-core"
description = "Lógica de negócio do Folio, sem dependência do Tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8.7"
cfb = "0.16.0"
comrak = { version = "0.59", default-features = false }
encoding_rs = "0.8.44"
jiff = "0.2.45"
log = "0.4.35"
rusqlite = { version = "0.42.0", features = ["bundled", "functions"] }
rustix = { version = "1.1.6", features = ["fs"] }
saphyr = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
trash = "5.3.0"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.2", features = ["v7"] }
zip = { version = "9.6.0", default-features = false }

[lints]
workspace = true
