[package]
name = "folio-core"
description = "Lógica de negócio do Folio, sem dependência do Tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8.7"
log = "0.4.35"
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
trash = "5.3.0"
uuid = { version = "1.29.2", features = ["v7"] }

[lints]
workspace = true
